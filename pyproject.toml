[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secplugin"
description = "WebSocket Plugin Framework for Secluded."
version = "1.3.0"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SumaRoder", email = "1493813167@qq.com"},
]
keywords = ["websocket", "plugin", "secluded", "sdk", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "websockets",
    "typing_extensions",
]

[project.optional-dependencies]
dev = [
    "colorlog",
    "watchdog",
]

[project.urls]
Homepage = "https://github.com/SumaRoder/SecPluginPySdk"
Repository = "https://github.com/SumaRoder/SecPluginPySdk"
Issues = "https://github.com/SumaRoder/SecPluginPySdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "pyright>=1.1.410",
    "pytest>=8.4.2",
]
